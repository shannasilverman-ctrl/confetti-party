name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned Bun version
        id: bun
        run: |
          v=$(node -e 'console.log(require("./package.json").packageManager.split("@")[1])')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Audit production dependencies
        run: bun run audit:prod

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests with coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Enforce client bundle budget
        run: bun run check:bundle

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Verify webServer contract (spawn declared command, wait for 200)
        # Distinct port from the E2E suite so a SIGKILL-teardown race cannot
        # collide with Playwright's webServer bind.
        env:
          PW_PORT: "4271"
        run: bun run verify:webserver

      # Run each responsive matrix in a fresh Wrangler process. The local
      # Worker runtime can exit after a long mixed-device suite on constrained
      # runners, which turns otherwise passing cases into connection errors.
      - name: E2E tests — desktop
        run: bun run test:e2e:desktop

      - name: E2E tests — mobile
        run: bun run test:e2e:mobile

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
